- title: Challenges
  content: |
    I built the entire project on a phone using Chrome and Kaggle.
    
    The small screen made working with the notebook difficult, and Kaggle occasionally had saving or runtime issues that required me to refresh, restart the kernel, and run the notebook again.
    
    That was the main practical challenge.


- title: What I Learned
  content: |
    Implementing the models gave me a clearer understanding of how the concepts from Week 2 fit together.
    
    Feature scaling became more concrete through implementation. Multiple Linear Regression showed me how the regression model extends from one input to multiple inputs, while polynomial features showed me how transforming inputs can change what the model can represent.
    
    Most importantly, I could now connect the mathematics, code, optimization, and predictions instead of seeing them as separate pieces.
    
    I also moved from one input and one output in Week 1 to five inputs and one output in Week 2.


- title: Looking Back
  content: |
    This project was built to practice the concepts from Andrew Ng's Machine Learning Specialization, Course 1, Week 2.
    
    I started with the theory and turned it into a working regression project using a real dataset.
    
    It was another step in learning machine learning by actually building with what I learn.


