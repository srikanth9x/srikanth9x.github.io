- title: In 30 Seconds
  content: |
    [BrickHit](https://srikanth9x.itch.io/brickhit){: target="_blank"} is a reimagining of Breakout (Atari, 1976) built as a learning project by following Harvard’s CS50 2D game development course.
    
    It was the third game I built from the course, and like the previous two, I adapted the controls to work on a touchscreen.


