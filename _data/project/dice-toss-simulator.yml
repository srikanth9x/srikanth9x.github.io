- title: In 30 Seconds
  content: |
    [Dice Toss Simulator](https://srikanth9x.github.io/dice-toss-simulator){: target="_blank"} is a small JavaScript project that simulates rolling a dice and flipping a coin.
    
    I built it after learning how JavaScript's random function works. It became one of the first projects where I turned a simple programming concept into something interactive.
    
