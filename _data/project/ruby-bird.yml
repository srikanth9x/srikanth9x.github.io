- title: In 30 Seconds
  content: |
    [Ruby Bird](https://srikanth9x.itch.io/ruby-bird){: target="_blank"} is a reimagining of Flappy Bird (Dong Nguyen, 2013) built as a learning project by following Harvard’s CS50 2D game development course.
    
    After completing [Ping Pong](/projects/ping-pong/), I moved on to the next game in the course and adapted it to work with a touchscreen.


