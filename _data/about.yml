- title: Beginning
  content: |
    I was born in 2008 in [Nampally, Hyderabad](https://en.wikipedia.org/wiki/Nampally,_Hyderabad). When I was two, I watched [Enthiran (Robot)](https://en.wikipedia.org/wiki/Enthiran) and became fascinated by robots.
    
    Growing up I loved [Doraemon's](https://en.wikipedia.org/wiki/Doraemon) gadgets and [Kiteretsu's](https://en.wikipedia.org/wiki/Kiteretsu_Daihyakka) inventions.
    
    But I also wondered **how do things work?**

- title: Spark
  content: | 
    In 7th standard, a [team](https://maps.app.goo.gl/tEVNVhoqoWTcNb7K7) visited our [school](https://maps.app.goo.gl/Nf3TXSQZ1RtM52EL6) to talk about inventions and inventors.
    
    That's when I thought, **Maybe I can build things too**.
    
- title: Lucky Phase
  content: |
    [Lockdown](https://en.wikipedia.org/wiki/COVID-19_lockdown_in_India) gave me time I never had before.
    
    I used it to learn how products are built and sold, and watched biographies of inventors and entrepreneurs.

- title: Launchpad
  content: |
    My first project began with wires, speakers, and a dream — **to build my own headphones and sell them**.
    
    I ran out of parts, tools, and money, and couldn’t finish even one working prototype.
    
    At first, I called it a failure. Later I realised — it was my **launchpad**.
    
- title: Discovery of Entrepreneurship
  content: |
    That failure pushed me toward something bigger.
    
    When I read [Zero to One](https://en.wikipedia.org/wiki/Zero_to_One), one idea hit me hard:
    
    **Competition is for losers**.
    
    I stopped building copies of what already exists.
    
    I started looking for my own problems — and building projects to solve them.
    
- title: Switch
  content: |
    While building headphones, I learned [WordPress](https://en.wikipedia.org/wiki/WordPress) to sell them online, but building a site on a phone was painful — dragging blocks on a small screen drained me.
    
    One day, I discovered building websites by coding. Typing felt simpler than dragging.
    
    I struggled and failed at first, but I kept going. Slowly, things clicked.
    
    **Software needs only curiosity and time**.
    
    **Hardware needs parts, tools, and money**.
    
    For now, I chose software — but I’ll return to hardware.