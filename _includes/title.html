<section class="card" id="title">
  <h2>{{ page.title }}</h2>
  {% if page.last_updated %}
    <p>Last Updated:
      <time datetime="{{ page.last_updated }}">{{ page.last_updated | date: "%B %-d, %Y"}}</time>
    </p>
  {% elsif page.data == 404 %}
    <p>Page Not Found</p>
  {% endif %}
</section>
